const GUIDE_MD="# راهنمای کامل نصب Valy Launcher\n\n**نسخه:** 3.2.2 · **سازنده:** VisualC5 [LNTB017]\n\nاین راهنما مراحل نصب اپ با `Install.bat`، روش **Unblock** کردن فایل‌ها، و رفع مشکلات رایج رو توضیح می‌ده.\n\n---\n\n## ۱) پیش‌نیازها\n\n- ویندوز ۱۰ یا ۱۱\n- Google Chrome (پیشنهادی) و/یا Microsoft Edge\n- PowerShell 5.1 (به‌صورت پیش‌فرض روی ویندوز هست)\n- **نیازی به دسترسی Administrator نیست.** نصب‌کننده فقط توی حساب خودت (HKCU) تغییر ایجاد می‌کنه.\n\n---\n\n## ۲) اول از همه: Unblock کردن فایل (مهم)\n\nویندوز به فایل‌هایی که از اینترنت دانلود می‌شن یه برچسب به اسم **Mark of the Web** (فایل `Zone.Identifier`) می‌زنه. به همین خاطر موقع اجرای `Install.bat` یا فایل‌های `.vbs` / `.ps1` ممکنه پیام SmartScreen یا «Windows protected your PC» ببینی، یا اسکریپت‌ها اجرا نشن. با Unblock این برچسب برداشته می‌شه.\n\n### روش ۱ — قبل از استخراج (پیشنهادی)\n\n1. روی فایل `ValyLauncher.zip` راست‌کلیک کن → **Properties**\n2. پایین تب **General** تیک **Unblock** رو بزن\n3. **Apply** و بعد **OK**\n4. حالا zip رو استخراج کن\n\n### روش ۲ — با PowerShell\n\nبرای خود zip:\n\n```powershell\nUnblock-File -Path \"$env:USERPROFILE\\Downloads\\ValyLauncher.zip\"\n```\n\nبعد از استخراج، برای همه فایل‌های پوشه (مسیر رو با مسیر خودت عوض کن):\n\n```powershell\nGet-ChildItem -Path \"C:\\Valy\" -Recurse | Unblock-File\n```\n\n### روش ۳ — اگه موقع اجرا SmartScreen اومد\n\nروی **More info** کلیک کن، بعد **Run anyway**.\n\n> نصب‌کننده (`Install.bat`) خودش هم بعد از شروع، همه فایل‌های پوشه رو Unblock می‌کنه.\n\n---\n\n## ۳) استخراج\n\nzip رو توی یه **مسیر ثابت** استخراج کن، مثلاً `C:\\Valy`.\nاز داخل خود zip اجرا نکن، و بعد از نصب پوشه رو جابه‌جا نکن (شورتکات به همون مسیر اشاره می‌کنه). اگه جابه‌جا کردی، دوباره `Install.bat` رو بزن.\n\n---\n\n## ۴) نصب با Install.bat\n\n1. روی `Install.bat` دابل‌کلیک کن\n2. صبر کن تا پیام نصب موفق بیاد و یه کلید بزنی\n\n`Install.bat` این کارها رو انجام می‌ده:\n\n| کار | جزئیات |\n|---|---|\n| Unblock فایل‌ها | همه فایل‌های همین پوشه |\n| ثبت لینک `valy://` | کلید `HKCU\\Software\\Classes\\valy` (فقط برای حساب خودت) |\n| ساخت شورتکات **Valy Launcher** | روی Desktop، Start menu و داخل همین پوشه، با آیکون Valy |\n\nهیچ سرویس، Scheduled Task یا برنامه استارتاپی ساخته نمی‌شه.\n\n---\n\n## ۵) اجرا\n\nشورتکات **Valy Launcher** رو باز کن. لانچر به‌صورت پنجره‌ی اپ Chrome (بدون ساید‌بار، سرچ‌بار و تب) باز می‌شه و **System bridge** هم خودکار اجرا می‌شه.\nبدون نصب هم می‌تونی `Start Valy Launcher.vbs` رو باز کنی.\n\nاگه کتابخونه‌ت قبلاً توی Edge بود: فایل `app\\config.json` رو باز کن و بنویس `{ \"browser\": \"edge\" }`، یا از **Settings → Data → Export all** بگیر و توی نسخه جدید **Import** کن.\n\n---\n\n## ۶) System bridge چیه؟\n\nیه سرویس کوچیک محلیه که فقط روی `127.0.0.1` گوش می‌ده (از بیرون سیستم قابل دسترسی نیست) و به لانچر اجازه می‌ده:\n\n- دکمه **Browse…** (انتخاب فایل با پنجره‌ی واقعی ویندوز)\n- دکمه **Show in folder**\n- اجرای EXE و باز کردن HTML در حالت App / Google / Google Application\n\nامنیت: هر بار با یه توکن تصادفی جدید شروع می‌شه و فقط صفحه‌ی لانچر (`file://`) می‌تونه باهاش حرف بزنه. حدود ۵ دقیقه بعد از بستن لانچر خودش خاموش می‌شه.\n\n---\n\n## ۷) باز کردن HTML و سایت‌ها\n\nهر سایت، بازی یا HTML که باز می‌کنی می‌پرسه کجا اجرا بشه:\n\n- **App** — پنجره‌ی اپ Edge، بدون تب\n- **Google** — تب معمولی Chrome\n- **Google Application** — پنجره‌ی اپ Chrome، بدون ساید‌بار و سرچ‌بار و تب\n- **Inside Valy** — داخل خود لانچر (برای HTMLهایی که داخل کتابخونه ذخیره شدن)\n\nبا تیک **Remember my choice** انتخاب ثابت می‌شه، و از **Settings → Launcher** عوضش می‌کنی.\n\n---\n\n## ۸) Artoul Defender\n\nفایل `Artoul Defender.cmd` رو اجرا کن. یه پنجره‌ی رنگی باز می‌شه و این‌ها رو بررسی می‌کنه:\n\n1. سالم بودن فایل‌ها با SHA-256 (مقایسه با `app\\manifest.sha256`)\n2. فایل‌های اجرایی پنهان یا نوع‌فایل‌های خطرناک\n3. الگوهای مشکوک توی اسکریپت‌ها (دانلود از اینترنت، دستور کدشده، غیرفعال‌کردن Defender، ...)\n4. برچسب Mark of the Web (و پیشنهاد Unblock)\n5. اسکن با موتور Windows Defender (اگه فعال باشه)\n\nآخرش نتیجه رو نشون می‌ده و با **Enter** بسته می‌شه. این یه بررسی محلیه و جایگزین آنتی‌ویروس کامل نیست. برای ایموجی‌ها از Windows Terminal استفاده کن (ویندوز ۱۱ پیش‌فرض داره).\n\n---\n\n## ۹) مشکلات رایج\n\n| مشکل | راه‌حل |\n|---|---|\n| «Windows protected your PC» | بخش ۲ (Unblock) و More info → Run anyway |\n| `Install.bat` اجرا نمی‌شه / فوراً بسته می‌شه | فایل‌ها Unblock نیستن؛ روش ۱ یا ۲ |\n| لینک `valy://` چیزی باز نمی‌کنه | یک بار `Install.bat` رو دوباره بزن |\n| دکمه Browse کار نمی‌کنه | لانچر رو از شورتکات **Valy Launcher** باز کن (نه مستقیم از فایل HTML) |\n| Chrome/Edge پیدا نشد | نصبشون کن، یا مسیرشون رو توی **Settings → Launcher** بده |\n| آنتی‌ویروس هشدار داد | اسکریپت‌هایی که مرورگر و سرویس محلی اجرا می‌کنن ممکنه هشدار الکی بدن. `Artoul Defender` رو اجرا کن و فایل رو توی VirusTotal هم چک کن |\n\n---\n\n## ۱۰) حذف\n\n`Uninstall.bat` رو اجرا کن. لینک `valy://`، شورتکات‌ها و فایل‌های موقت پاک می‌شن. اطلاعات کتابخونه توی مرورگر باقی می‌مونه.\n";

(function(){let T=null,goal=0,raf=0;const step=()=>{if(!T){raf=0;return}const d=goal-T.scrollLeft;if(Math.abs(d)<.5){T.scrollLeft=goal;T=null;raf=0;return}T.scrollLeft+=d*.18;raf=requestAnimationFrame(step)};

const PM=(()=>{
 const list=[],run={},ev={};
 let dir='',bridge=true;
 const ST=()=>(S.plugins=S.plugins||{}),HS=()=>(S.plHash=S.plHash||{});
 const emit=(n,...a)=>{(ev[n]||[]).slice().forEach(x=>{try{x.fn(...a)}catch(e){console.error('[plugin '+x.id+']',e)}})};
 const Q=t=>typeof t=='string'?document.querySelector(t):t;

 async function load(){
  if(!PREM){list.length=0;bridge=false;return}
  try{const r=await br('/plugins',{},30000);if(r&&r.ok){dir=r.dir||'';list.length=0;(r.plugins||[]).forEach(p=>list.push(p));bridge=true}else bridge=false}
  catch{bridge=false}
 }

 function makeApi(p,c){
  const key='valy:plugin:'+p.id+':',track=e=>(c.els.push(e),e),L=typeof LS!='undefined'?LS:localStorage;
  const css=txt=>{const s=document.createElement('style');s.dataset.plugin=p.id;s.textContent=String(txt);document.head.append(s);c.css.push(s);return s};
  const A=p.assets||{};
  return {
   version:'1.0',
   premium:(()=>{try{return !!PREM}catch{return false}})(),
   plugin:{id:p.id,name:p.name,version:p.version,author:p.author},
   ui:{
    css,
    html(target,h,pos){
     const t=Q(target);if(!t)return null;
     const w=document.createElement('template');w.innerHTML=String(h).trim();
     const els=[...w.content.children];els.forEach(e=>{e.dataset.plugin=p.id;track(e)});
     const m={beforeend:'append',afterbegin:'prepend',beforebegin:'before',afterend:'after'}[pos||'beforeend']||'append';
     t[m](...els);return els.length==1?els[0]:els;
    },
    toast:m=>toast(String(m)),
    modal:h=>modal(String(h),''),
    esc:s=>esc(s)
   },
   theme:{
    vars(o){
     const st=document.body.style;
     Object.entries(o||{}).forEach(([k,v])=>{
      const n=k.startsWith('--')?k:'--'+k;
      if(!(n in c.vprev))c.vprev[n]=st.getPropertyValue(n);
      st.setProperty(n,String(v));
     });
    },
    css,
    bodyClass(...names){names.forEach(n=>{if(!document.body.classList.contains(n)){document.body.classList.add(n);c.undo.push(()=>document.body.classList.remove(n))}})},
    get:n=>getComputedStyle(document.body).getPropertyValue(n.startsWith('--')?n:'--'+n).trim(),
    isNight:()=>document.body.classList.contains('night'),
    hue:()=>S.hue
   },
   hud:{
    addButton(o){
     o=o||{};const b=document.createElement('button');b.className='rb';b.title=o.title||'';b.dataset.plugin=p.id;
     b.innerHTML=o.svg||(o.icon&&IC[o.icon]?I(o.icon):'')||esc(o.text||'•');
     b.onclick=e=>{try{o.onClick&&o.onClick(e,b)}catch(x){console.error('[plugin '+p.id+']',x)}};
     const hb=Q('header .hb');hb.insertBefore(b,Q('#th'));return track(b);
    },
    addWidget(h,o){
     const side=(o&&o.side)||'right',el=document.createElement('div');el.className='pl-widget';el.dataset.plugin=p.id;el.innerHTML=String(h);
     if(side=='left')Q('header .brand').after(el);else if(side=='center')Q('#bms').before(el);else Q('header .hb').prepend(el);
     return track(el);
    },
    css
   },
   pages:{
    add(o){
     const k='pl_'+p.id+'_'+String(o.id||'page').replace(/[^a-z0-9_-]/gi,'');
     PGS[k]=m=>{try{o.render(m)}catch(e){m.innerHTML='<div class="pl-err">Plugin error: '+esc(e.message)+'</div>'}};
     const b=document.createElement('button');b.dataset.k=k;b.title=o.title||'';
     b.innerHTML='<em>'+I(IC[o.icon]?o.icon:'star')+'</em><span class="lb">'+esc(o.title||'Plugin')+'</span>';
     b.onclick=()=>{tab=k;q='';sel=null;fav=0;render()};
     Q('#nav').append(b);c.pages.push(k);try{ind()}catch{}return k;
    }
   },
   sound:{
    play(src,o){
     o=o||{};const a=new Audio(A[src]||src);a.volume=Math.max(0,Math.min(1,o.volume==null?.6:o.volume));a.loop=!!o.loop;
     a.play().catch(()=>{});c.audios.push(a);return a;
    },
    beep(f,ms,type,vol){
     try{
      f=f||880;ms=ms||120;const X=window.__vpa||(window.__vpa=new(window.AudioContext||window.webkitAudioContext)());
      const os=X.createOscillator(),g=X.createGain();os.type=type||'sine';os.frequency.value=f;g.gain.value=vol==null?.15:vol;
      os.connect(g);g.connect(X.destination);os.start();g.gain.exponentialRampToValueAtTime(.0001,X.currentTime+ms/1000);os.stop(X.currentTime+ms/1000+.02);
     }catch{}
    },
    stopAll(){c.audios.forEach(a=>{try{a.pause()}catch{}})}
   },
   assets:{
    url:n=>A[n]||'',
    has:n=>!!A[n],
    text(n){const u=A[n];if(!u)return '';try{return decodeURIComponent(escape(atob(u.split(',')[1])))}catch{return ''}}
   },
   storage:{
    get(k,d){try{const v=L.getItem(key+k);return v==null?d:JSON.parse(v)}catch{return d}},
    set(k,v){try{L.setItem(key+k,JSON.stringify(v))}catch{}},
    remove(k){try{L.removeItem(key+k)}catch{}}
   },
   settings:{section(d){c.sec={title:(d&&d.title)||'Options',render:d&&d.render}}},
   on(n,fn){(ev[n]=ev[n]||[]).push({id:p.id,fn})},
   onDisable(fn){c.undo.push(fn)},
   timer:{
    every(ms,fn){const t=setInterval(()=>{try{fn()}catch(e){console.error('[plugin '+p.id+']',e)}},ms);c.timers.push(t);return t},
    after(ms,fn){const t=setTimeout(()=>{try{fn()}catch(e){console.error('[plugin '+p.id+']',e)}},ms);c.timers.push(t);return t}
   },
   app:{
    tab:()=>tab,
    go:k=>{tab=k;q='';sel=null;fav=0;render()},
    render:()=>render(),
    state:()=>JSON.parse(JSON.stringify(S)),
    tabs:()=>TABS.map(t=>({key:t[0],name:t[1]}))
   },
   log:(...a)=>console.log('[plugin '+p.id+']',...a)
  };
 }

 function start(p){
  if(run[p.id]||p.error)return;
  const c={id:p.id,els:[],css:[],undo:[],audios:[],timers:[],pages:[],vprev:{},sec:null,err:''};
  run[p.id]=c;
  const api=makeApi(p,c);
  if(p.css)api.ui.css(p.css);
  if(p.main){
   window.__vp=window.__vp||{};window.__vp[p.id]={api,info:api.plugin,ran:0};
   let err='';const h=e=>{err=e.message||'Script error';e.preventDefault()};
   window.addEventListener('error',h);
   try{
    const s=document.createElement('script');
    s.textContent='(function(valy,plugin){"use strict";window.__vp['+JSON.stringify(p.id)+'].ran=1;\n'+p.main+'\n})(window.__vp['+JSON.stringify(p.id)+'].api,window.__vp['+JSON.stringify(p.id)+'].info);\n//# sourceURL=valyp-'+p.id+'.js';
    document.head.append(s);s.remove();
   }catch(e){err=e.message}
   window.removeEventListener('error',h);
   if(!window.__vp[p.id].ran&&!err)err='The plugin could not be loaded (syntax error?)';
   if(err){c.err=err;console.error('[plugin '+p.id+']',err)}
  }
 }

 function stop(id){
  const c=run[id];if(!c)return;
  try{c.undo.slice().reverse().forEach(f=>{try{f()}catch{}})}catch{}
  Object.entries(c.vprev).forEach(([n,v])=>{v?document.body.style.setProperty(n,v):document.body.style.removeProperty(n)});
  c.els.forEach(e=>e.remove());c.css.forEach(e=>e.remove());
  c.audios.forEach(a=>{try{a.pause()}catch{}});
  c.timers.forEach(t=>{clearInterval(t);clearTimeout(t)});
  Object.keys(ev).forEach(k=>{ev[k]=ev[k].filter(x=>x.id!=id)});
  let redo=0;
  c.pages.forEach(k=>{delete PGS[k];const b=Q('#nav [data-k="'+k+'"]');if(b)b.remove();if(tab==k){tab='home';redo=1}});
  delete run[id];if(window.__vp)delete window.__vp[id];
  if(redo)render();else try{ind()}catch{}
 }

const sgUrl = x => { if (!sg.urls.has(x.id)) { const ext = (/\.([a-z0-9]+)$/i.exec(x.fname || x.name) || [])[1], t = MIME[(ext || '').toLowerCase()] || x.blob.type || 'audio/mpeg'; sg.urls.set(x.id, URL.createObjectURL(new Blob([x.blob], { type: t }))); } return sg.urls.get(x.id); };

async function sgLoad() { try { sg.list = (await fdb.all('songs')).filter(x => x && x.blob).sort((a, b) => a.t - b.t); } catch (e) { sg.list = []; } sg.loaded = true; }

}
function sgStep(d) {

  if (p < 0) p = sg.queue.length - 1;

}
function sgToggle() { if (!sgA.src) { if (sg.list.length) sgPlay(sg.list[0].id); return; } if (sgA.paused) sgA.play().catch(e => { if (e && e.name != 'AbortError') toast('Could not play: ' + (e.message || e.name)); }); else sgA.pause(); }

sgA.addEventListener('play', () => sgUi()); sgA.addEventListener('pause', () => sgUi());

async function sgAddFiles(files) {

      (sg.list.length ? sg.list.map(s => '<div class="sgr ' + (sg.queue[sg.pos] == s.id ? 'cur' : '') + '" data-id="' + s.id + '"><span class="ic">' + sgIco(s) + '</span><b>' + esc(s.name) + '</b><button class="ib" data-del="' + s.id + '" title="Delete">' + I('trash') + '</button></div>').join('') : '<div class="empty"><div class="big">' + I('v_music') + '</div><p>No songs yet — press “Add songs”</p></div>');

sgLoad().then(() => { if (tab == 'songs' && sg.redraw) sg.redraw(); });

const favOf = u => { try { u = String(u || '').trim(); if (!u) return ''; const x = new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(u) ? u : 'https://' + u); if (!/^https?:$/.test(x.protocol)) return ''; return 'https://www.google.com/s2/favicons?sz=128&domain_url=' + encodeURIComponent(x.origin); } catch (e) { return ''; } };
const US_SITES = [["Piliapp", "https://www.piliapp.com/"], ["CrazyGames", "https://www.crazygames.com/"], ["TierMaker", "https://tiermaker.com/"], ["Resource Pack Creator", "https://resourcepackcreator.com/"], ["Minecraft Tools", "https://minecraft.tools/en/"], ["OpenBattle", "https://openbattle.ir/"], ["Modrinth", "https://modrinth.com/"], ["OpenFront", "https://openfront.io/"], ["Birdflop", "https://www.birdflop.com/"], ["GD Browser", "https://gdbrowser.com/"], ["Pointercrate Demonlist", "https://www.pointercrate.com/demonlist/"], ["AREDL", "https://aredl.net/"], ["Impossible Levels", "https://impossiblelevels.com/"]];

  }

/* ---------- 6) select many (Ctrl / Shift / ⌘ + click) and drag them onto another tab, in every list ---------- */
const SELS = new Set(); let selTab = tab, dragFlag = 0;
const grpOf = k => /^ft_/.test(k) || ['games', 'htmls', 'tools', 'progs'].includes(k) ? 'L' : k == 'sites' ? 'S' : ['txt', 'md', 'code', 'prompts', 'scripts', 'json'].includes(k) ? 'T' : '';
const canGo = k => { const g = grpOf(k); return !!g && g == grpOf(tab) && k != tab; };
const tileOf = t => { const e = t && t.closest && t.closest('#main .it[data-id],#main .row[data-id]'); return e && items[e.dataset.id] && !items[e.dataset.id].folder ? e : null; };
function selPaint() {

  b.innerHTML = '<b>' + SELS.size + ' selected</b>' + (grpOf(tab) && [...TABS].some(t => canGo(t[0])) ? '<button class="btn" data-b="mv">' + I('move') + ' Move to tab</button>' : '') + '<button class="btn red" data-b="dx">' + I('trash') + ' Delete</button><button class="btn" data-b="cl">Clear</button>';

async function selBar(e) {

  else if (a == 'mv') { const o = modal('<h2>' + I('move') + ' Move ' + ids.length + ' item(s) to…</h2><div class="mvl">' + TABS.filter(t => canGo(t[0])).map(t => '<button class="btn" data-to="' + t[0] + '">' + I(t[2]) + ' ' + esc(t[1]) + '</button>').join('') + '</div><div class="end"><button class="btn" id="vc">Cancel</button></div>'); $('#vc', o).onclick = o.cl; $$('[data-to]', o).forEach(x => x.onclick = () => { o.cl(); selMove(ids, x.dataset.to); }); }

  if ((e.key == 'a' || e.key == 'A') && (e.ctrlKey || e.metaKey) && !/INPUT|TEXTAREA|SELECT/.test((e.target.tagName || '')) && !document.querySelector('.modal') && $$('#main .it[data-id],#main .row[data-id]').length) { e.preventDefault(); $$('#main .it[data-id],#main .row[data-id]').forEach(x => { if (tileOf(x)) SELS.add(x.dataset.id); }); selPaint(); }
});
(function dragInit() {

  const stop = () => { if (!d) return; document.body.classList.remove('vsel-drag'); $$('#nav button').forEach(b => b.classList.remove('vdrop-ok', 'vdrop-no', 'vdrop-hot')); if (ghost) ghost.remove(); ghost = null; d = null; };
